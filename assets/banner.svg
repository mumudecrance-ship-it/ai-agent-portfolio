  <text x="600" y="152" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="21" font-weight="400" fill="#cbd5e1" letter-spacing="2">用工程手段驯化 AI，把黑盒变成可复现的生产线</text>

  <rect x="480" y="182" width="240" height="2" rx="1" fill="url(#divider)"/>

  <rect x="80" y="218" width="500" height="158" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="104" y="238" width="4" height="118" rx="2" fill="#a78bfa" fill-opacity="0.7"/>
  <text x="128" y="262" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="21" font-weight="600" fill="#f1f5f9">评价域工作流生产 Skill</text>
  <text x="128" y="298" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" font-weight="400" fill="#a5b4fc" letter-spacing="1">四层约束 · 脚本门禁 · 生产台账</text>
  <text x="128" y="340" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" font-weight="600" fill="#e2e8f0">26× 提速 &#160;&#160;·&#160;&#160; 94% 命中 &#160;&#160;·&#160;&#160; 0 想象节点</text>

  <rect x="620" y="218" width="500" height="158" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#06b6d4" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="644" y="238" width="4" height="118" rx="2" fill="#22d3ee" fill-opacity="0.7"/>
  <text x="668" y="262" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="21" font-weight="600" fill="#f1f5f9">大型活动散场推演 Agent</text>
  <text x="668" y="298" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" font-weight="400" fill="#67e8f9" letter-spacing="1">确定性引擎 · 单写者结算 · 具名签发</text>
  <text x="668" y="340" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" font-weight="600" fill="#e2e8f0">38/38 测试 &#160;&#160;·&#160;&#160; 8/8 门槛 &#160;&#160;·&#160;&#160; 93 分审计</text>
