<svg width="1920" height="640" viewBox="0 0 1920 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Agent 作品集 — 用工程手段驯化 AI，把黑盒变成可复现的生产线">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1120"/>
      <stop offset="0.55" stop-color="#0c1322"/>
      <stop offset="1" stop-color="#080c17"/>
    </linearGradient>

    <radialGradient id="washBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b8def" stop-opacity="0.14"/>
      <stop offset="0.6" stop-color="#5b8def" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#5b8def" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="washTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2fd3c0" stop-opacity="0.13"/>
      <stop offset="0.6" stop-color="#2fd3c0" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#2fd3c0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="pipeLine" x1="1020" y1="0" x2="1780" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b8def" stop-opacity="0.20"/>
      <stop offset="0.75" stop-color="#5b8def" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8fb4f5" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.36" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <mask id="gridMask">
      <rect width="1920" height="640" fill="url(#gridFade)"/>
    </mask>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="softTeal" x="-140%" y="-140%" width="380%" height="380%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#2fd3c0" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1920" height="640" fill="url(#bg)"/>

  <ellipse cx="1580" cy="120" rx="720" ry="440" fill="url(#washBlue)"/>
  <ellipse cx="1660" cy="560" rx="620" ry="380" fill="url(#washTeal)"/>

