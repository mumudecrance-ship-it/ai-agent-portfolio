      <stop offset="35%" stop-color="#60a5fa"/>
      <stop offset="70%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="divider" x1="0%" y1="0%" x2="100%" y2="0%">
