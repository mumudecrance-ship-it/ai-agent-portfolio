<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Agent 作品集 — 两个用工程手段驯化 AI 的项目">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <ellipse cx="600" cy="140" rx="620" ry="200" fill="url(#glow)"/>

  <circle cx="110" cy="60" r="46" fill="#ffffff" opacity="0.10"/>
  <circle cx="1090" cy="52" r="70" fill="#ffffff" opacity="0.08"/>
  <circle cx="1120" cy="230" r="54" fill="#ffffff" opacity="0.12"/>
  <circle cx="70" cy="230" r="26" fill="#ffffff" opacity="0.14"/>
  <circle cx="330" cy="38" r="10" fill="#ffffff" opacity="0.20"/>
  <circle cx="760" cy="46" r="14" fill="#ffffff" opacity="0.18"/>
  <circle cx="540" cy="232" r="12" fill="#ffffff" opacity="0.16"/>
  <circle cx="900" cy="220" r="8" fill="#ffffff" opacity="0.22"/>

  <line x1="180" y1="120" x2="420" y2="120" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>
  <line x1="780" y1="170" x2="1020" y2="170" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>

  <text x="600" y="128" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="64" font-weight="700" fill="url(#title)" letter-spacing="4">AI Agent 作品集</text>

  <text x="600" y="196" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="26" font-weight="400" fill="#ffffff" fill-opacity="0.88" letter-spacing="2">两个用工程手段驯化 AI 的项目</text>
</svg>
