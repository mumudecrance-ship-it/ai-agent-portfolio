    <circle cx="1050" cy="84" r="6" stroke-opacity="0.30" fill="none" stroke-width="1.5"/>
    <circle cx="60" cy="360" r="3" stroke-opacity="0.30" fill="none" stroke-width="1.5"/>
    <circle cx="1140" cy="360" r="4" stroke-opacity="0.28" fill="none" stroke-width="1.5"/>
