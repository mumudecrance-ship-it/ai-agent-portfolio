  <rect width="1200" height="400" fill="url(#base)"/>

  <ellipse cx="230" cy="90" rx="360" ry="260" fill="url(#aurora1)"/>
  <ellipse cx="620" cy="340" rx="430" ry="280" fill="url(#aurora2)"/>
  <ellipse cx="900" cy="60" rx="340" ry="240" fill="url(#aurora3)"/>
  <ellipse cx="1100" cy="330" rx="300" ry="220" fill="url(#aurora4)"/>

