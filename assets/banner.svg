  <text x="120" y="388" font-family="'Hiragino Sans GB','PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="31" font-weight="400" letter-spacing="1" fill="#a9b5c7">用工程手段驯化 AI，把「黑盒」变成「可复现的生产线」</text>

